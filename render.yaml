services:
  - type: web
    name: speakwise
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && cp artifacts/speakwise/index.template artifacts/speakwise/index.html && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/speakwise run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: speakwise-db
          property: connectionString

databases:
  - name: speakwise-db
    plan: free